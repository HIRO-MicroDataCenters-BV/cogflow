site_name: cogflow
site_description: Cognitive Framework — ML workflow + agent SDK.
repo_url: https://github.com/HIRO-MicroDataCenters-BV/cogflow
repo_name: HIRO-MicroDataCenters-BV/cogflow
edit_uri: edit/refactor/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Agent SDK:
      - Overview: agent/index.md
      - Getting started: agent/getting-started.md
      - Architecture: agent/architecture.md
      - Node types: agent/nodes.md
      - State & channels: agent/state.md
      - Tracing & observability: agent/tracing.md
      - Migrating off Flowise: agent/migration.md
