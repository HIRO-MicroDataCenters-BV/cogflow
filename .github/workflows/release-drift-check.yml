name: Release Drift Check

# Guards against orphaned release-branch fixes: a hotfix committed onto a
# release/* branch but never merged back to develop. Compares each active
# release/* branch to develop by *patch-id* (so a fix re-applied to develop
# as a different commit is correctly treated as present), ignoring version
# bumps (which are release-only by design). On drift it opens a tracking
# issue and fails, so the gap is visible instead of silently shipping.
#
# NOTE: scheduled triggers only fire from the default branch (main), so this
# file must reach main for the weekly run to activate. workflow_dispatch
# works from any branch it exists on.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check release -> develop drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git fetch --quiet origin

          report=""
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/release); do
            # git cherry marks commits in <ref> not in develop: '+' = patch
            # genuinely missing, '-' = an equivalent patch already in develop.
            # Keep only '+', then drop version-bump commits.
            missing="$(git cherry -v origin/develop "$ref" \
              | grep '^+' \
              | grep -viE 'bump version' || true)"
            if [ -n "$missing" ]; then
              report="${report}### ${ref#origin/}"$'\n'"${missing}"$'\n\n'
            fi
          done

          if [ -z "$report" ]; then
            echo "✅ No drift — every non-version release commit is present in develop." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf '⚠️ Orphaned release-branch fixes (patch not in develop):\n\n%s\n' "$report" \
            | tee -a "$GITHUB_STEP_SUMMARY"

          title="Release→develop drift detected"
          body="$(printf 'The automated drift check found commits on release/* branches (excluding version bumps) whose patch is **not** in develop. Backport each one to develop, or confirm it is intentionally release-only.\n\n%s\n_Generated by `.github/workflows/release-drift-check.yml`._' "$report")"

          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -z "${existing:-}" ]; then
            gh issue create --title "$title" --body "$body" || true
          fi
          exit 1
