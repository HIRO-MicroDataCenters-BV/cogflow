name: Lint and Test

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Cache the pip wheel cache so ``torch`` / ``safetensors`` (pulled
      # by ``[llm]`` and used by the ntkmirror exporter round-trip
      # tests) don't get redownloaded on every CI run. CPU-only torch
      # wheels are ~200MB; the first warm-up after a pyproject change
      # eats that cost, every subsequent run hits the cache.
      #
      # Key on a hash of pyproject.toml so the cache invalidates only
      # when extras change. ``~/.cache/uv`` covers uv's wheel cache;
      # ``~/.cache/pip`` is included as a safety net for any step that
      # bypasses uv.
      - name: Cache pip/uv wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: ${{ runner.os }}-py3.10-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py3.10-pip-

      # Install the in-tree cogflow plus every extras group the test
      # suite touches: ``[dev]`` (pytest + ruff + coverage) and
      # ``[full]`` ("the works" — agent SDK + OTel tracing + openai
      # gate + LLM-side transformations via ``[llm]``). The wheel
      # cache above keeps the torch/safetensors pull from running on
      # every PR.
      #
      # uv's resolver handles the deep openinference/langchain
      # dependency graph that made pip's legacy resolver hit
      # ``resolution-too-deep``; ``--system`` installs into the
      # ``actions/setup-python`` interpreter so ruff/pytest land on PATH.
      - name: Install package + extras
        run: uv pip install --system -e ".[dev,full]"

      # Single tool replaces the prior black + pycodestyle + pylint stack.
      # ``ruff check`` covers the lint surface (E/W/F/I/UP/B rules at
      # line-length=120, configured in pyproject.toml). ``ruff format
      # --check`` enforces the formatter the way ``black --check`` did.
      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      # ``pytest`` (no path) honours ``testpaths`` from pytest.ini, which
      # includes both ``tests/`` (base cogflow) and ``cogflow/agent/tests/``
      # (agent SDK). The agent suite needs the langgraph + langchain-core
      # deps brought in by the ``[full]`` extra above.
      - name: Run tests
        run: pytest
