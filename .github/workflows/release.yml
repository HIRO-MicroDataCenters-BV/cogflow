name: Build and Release

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'cogflow version to build & publish the image for (must already be on PyPI, e.g. 2.0.1b4)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}


    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: pip install --upgrade pip build pytest pytest-mock

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/

      - name: Build package
        run: python -m build

      - name: Extract version
        id: version
        run: |
          VERSION=$(python -c "import cogflow; print(cogflow.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *b* || "$VERSION" == *rc* || "$VERSION" == *a* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Built version: $VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: cogflow-${{ steps.version.outputs.version }}
          path: dist/

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cogflow/
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: cogflow-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v') && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: cogflow-${{ needs.build.outputs.version }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          generate_release_notes: true

  docker-publish:
    needs: [build, publish-pypi]
    # Runs on tag-push (gated on publish-pypi) and on workflow_dispatch (manual
    # rebuild, where build/publish-pypi are skipped). `always()` + the inner
    # condition pick the mode. See docker_image_variants/readme.md → Triggers.
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch'
        || (startsWith(github.ref, 'refs/tags/v') && needs.publish-pypi.result == 'success')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Determine channel, image tags, and build platforms
        id: tags
        env:
          VERSION: ${{ github.event.inputs.version || needs.build.outputs.version }}
        run: |
          # Single source for the registry namespace so a rename touches
          # one line and both images stay in sync.
          REGISTRY_NS="hiroregistry"
          REGISTRY="$REGISTRY_NS/cogflow"
          LITE_REGISTRY="$REGISTRY_NS/cogflow_lite"
          if [[ "$VERSION" == *b* ]]; then
            CHANNEL="beta"
          elif [[ "$VERSION" == *rc* ]]; then
            CHANNEL="rc"
          elif [[ "$VERSION" == *a* ]]; then
            CHANNEL="alpha"
          else
            CHANNEL="stable"
          fi
          # Arch policy (why stable is multi-arch and pre-release amd64-only):
          # docker_image_variants/readme.md → Architecture policy.
          if [[ "$CHANNEL" == "stable" ]]; then
            TAGS="$REGISTRY:$VERSION,$REGISTRY:latest"
            PLATFORMS="linux/amd64,linux/arm64"
          else
            TAGS="$REGISTRY:$VERSION,$REGISTRY:latest-$CHANNEL"
            PLATFORMS="linux/amd64"
          fi
          # Framework runtime bases the training-job variants build FROM
          # (published by runtime-images.yml; readme.md → Training-job variants).
          # shellcheck disable=SC1091
          source docker_image_variants/runtime/versions.env
          {
            echo "tags=$TAGS"
            echo "channel=$CHANNEL"
            echo "platforms=$PLATFORMS"
            echo "registry=$REGISTRY"
            echo "version_tag=$REGISTRY:$VERSION"
            echo "lite_registry=$LITE_REGISTRY"
            echo "torch_runtime=$REGISTRY_NS/cogflow-runtime:torch-$TORCH_VERSION"
            echo "tensor_runtime=$REGISTRY_NS/cogflow-runtime:tensor-$TF_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL"
          echo "Tags: $TAGS"
          echo "Platforms: $PLATFORMS"

      # tag-push fills dist/ from the build artifact; workflow_dispatch leaves
      # it empty and the Dockerfile installs from PyPI. See readme.md →
      # Build strategy: wheel artifact vs PyPI.
      - name: Prepare wheel directory in build context
        run: mkdir -p docker_image_variants/latest/dist

      - name: Download cogflow wheel from build artifact (tag-push path)
        if: github.event_name == 'push'
        uses: actions/download-artifact@v5
        with:
          name: cogflow-${{ needs.build.outputs.version }}
          path: ./docker_image_variants/latest/dist/

      # Only workflow_dispatch installs the main image from PyPI, so only it
      # needs this wait (see readme.md → Build strategy). Runs on the runner's
      # system python3 — stdlib only, no setup-python.
      - name: Wait for PyPI simple index (dispatch-only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 - <<'PY'
          import os, sys, time
          from urllib.request import urlopen
          from urllib.error import URLError

          version = os.environ["VERSION"]
          url = "https://pypi.org/simple/cogflow/"
          needles = (f"cogflow-{version}-", f"cogflow-{version}.")

          for attempt in range(1, 13):
              try:
                  with urlopen(url, timeout=10) as resp:
                      html = resp.read().decode("utf-8", errors="replace")
                  if any(n in html for n in needles):
                      print(f"cogflow=={version} visible on simple index")
                      sys.exit(0)
              except URLError as exc:
                  print(f"simple-index request failed ({attempt}/12): {exc}")
              print(f"Waiting for {version} on simple index ({attempt}/12)...")
              if attempt < 12:
                  time.sleep(20)

          print(f"::error::cogflow=={version} not found on simple index")
          sys.exit(1)
          PY

      # Only needed for non-native archs (arm64); driven off the same platforms
      # output so QEMU and build lists can't drift. See readme.md → Arch policy.
      - name: Set up QEMU
        if: contains(steps.tags.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ steps.tags.outputs.platforms }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push cogflow image
        uses: docker/build-push-action@v6
        with:
          context: ./docker_image_variants/latest
          # Explicit even for amd64-only builds (v6 manifest-index quirk).
          # See readme.md → Architecture policy.
          platforms: ${{ steps.tags.outputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            COGFLOW_VERSION=${{ github.event.inputs.version || needs.build.outputs.version }}
          # Per-image cache scope (full vs lite); see readme.md → Build cache.
          cache-from: type=gha,scope=latest
          cache-to: type=gha,mode=max,scope=latest

      - name: Smoke test pushed image
        run: |
          docker pull "${{ steps.tags.outputs.version_tag }}"
          docker run --rm "${{ steps.tags.outputs.version_tag }}" \
            python3 -c "import cogflow, kfp; print('cogflow', cogflow.__version__, 'kfp', kfp.__version__)"

      # Training-job variants (torch / tensor) layer a framework on the main
      # image pushed and smoke-tested just above (``FROM hiroregistry/cogflow:
      # <version>``), so they need neither the wheel nor PyPI and can't drift
      # from the main image. amd64-only on EVERY channel: the CUDA-enabled
      # torch wheels and ``tensorflow[and-cuda]`` have no arm64 build. See
      # readme.md → Training-job variants.
      #
      # A workflow_dispatch rebuild of a version that predates the trainers
      # (< 3.0.0b15) must not try to build them: probe the pushed image first
      # and gate every variant step on the result.
      - name: Check whether the base image ships the trainers
        id: trainers
        run: |
          if docker run --rm "${{ steps.tags.outputs.version_tag }}" \
               python3 -c "import cogflow.trainers" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "cogflow.trainers present: building torch/tensor variants"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "cogflow.trainers absent in this version: skipping torch/tensor variants"
          fi

      # The variants are layered on the framework runtime bases (multi-GB,
      # published separately by runtime-images.yml) and add only the cogflow
      # wheel from latest/dist/ (or PyPI on a dispatch rebuild). Context is
      # docker_image_variants/ so the bind-mount reaches latest/dist/.
      - name: Build and push cogflow torch variant
        if: steps.trainers.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./docker_image_variants
          file: ./docker_image_variants/torch/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.version_tag }}-torch
            ${{ steps.tags.outputs.registry }}:${{ steps.tags.outputs.channel == 'stable' && 'latest' || format('latest-{0}', steps.tags.outputs.channel) }}-torch
          build-args: |
            COGFLOW_VERSION=${{ github.event.inputs.version || needs.build.outputs.version }}
            RUNTIME_IMAGE=${{ steps.tags.outputs.torch_runtime }}
          cache-from: type=gha,scope=torch
          cache-to: type=gha,mode=max,scope=torch

      - name: Smoke test cogflow torch variant
        if: steps.trainers.outputs.present == 'true'
        run: |
          docker pull "${{ steps.tags.outputs.version_tag }}-torch"
          docker run --rm "${{ steps.tags.outputs.version_tag }}-torch" \
            python3 -c "import cogflow, torch; print('cogflow', cogflow.__version__, 'torch', torch.__version__)"

      - name: Build and push cogflow tensor variant
        if: steps.trainers.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./docker_image_variants
          file: ./docker_image_variants/tensor/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.version_tag }}-tensor
            ${{ steps.tags.outputs.registry }}:${{ steps.tags.outputs.channel == 'stable' && 'latest' || format('latest-{0}', steps.tags.outputs.channel) }}-tensor
          build-args: |
            COGFLOW_VERSION=${{ github.event.inputs.version || needs.build.outputs.version }}
            RUNTIME_IMAGE=${{ steps.tags.outputs.tensor_runtime }}
          cache-from: type=gha,scope=tensor
          cache-to: type=gha,mode=max,scope=tensor

      - name: Smoke test cogflow tensor variant
        if: steps.trainers.outputs.present == 'true'
        run: |
          docker pull "${{ steps.tags.outputs.version_tag }}-tensor"
          docker run --rm "${{ steps.tags.outputs.version_tag }}-tensor" \
            python3 -c "import cogflow, tensorflow as tf; print('cogflow', cogflow.__version__, 'tensorflow', tf.__version__)"

      # cogflow_lite installs cogflow from PyPI, so on tag-push wait for the
      # just-published wheel to reach the simple index before building lite
      # (18 × 20s ≈ 6 min). See readme.md → Build strategy.
      - name: Wait for PyPI simple index (tag-push, for cogflow_lite)
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, sys, time
          from urllib.request import urlopen
          from urllib.error import URLError

          version = os.environ["VERSION"]
          url = "https://pypi.org/simple/cogflow/"
          needles = (f"cogflow-{version}-", f"cogflow-{version}.")

          for attempt in range(1, 19):
              try:
                  with urlopen(url, timeout=10) as resp:
                      html = resp.read().decode("utf-8", errors="replace")
                  if any(n in html for n in needles):
                      print(f"cogflow=={version} visible on simple index")
                      sys.exit(0)
              except URLError as exc:
                  print(f"simple-index request failed ({attempt}/18): {exc}")
              print(f"Waiting for {version} on simple index ({attempt}/18)...")
              if attempt < 18:
                  time.sleep(20)

          print(f"::error::cogflow=={version} not found on simple index")
          sys.exit(1)
          PY

      # Built after the main image is pushed; a failure here leaves lite
      # un-pushed (re-run the job to reconcile). Platforms track the main
      # image. See readme.md → Release ordering caveat / Architecture policy.
      - name: Build and push cogflow_lite image
        uses: docker/build-push-action@v6
        with:
          context: ./docker_image_variants/lite
          platforms: ${{ steps.tags.outputs.platforms }}
          push: true
          tags: |
            ${{ steps.tags.outputs.lite_registry }}:${{ github.event.inputs.version || needs.build.outputs.version }}
            ${{ steps.tags.outputs.lite_registry }}:${{ steps.tags.outputs.channel == 'stable' && 'latest' || format('latest-{0}', steps.tags.outputs.channel) }}
          build-args: |
            COGFLOW_VERSION=${{ github.event.inputs.version || needs.build.outputs.version }}
          cache-from: type=gha,scope=lite
          cache-to: type=gha,mode=max,scope=lite

      - name: Smoke test cogflow_lite image
        run: |
          docker pull "${{ steps.tags.outputs.lite_registry }}:${{ github.event.inputs.version || needs.build.outputs.version }}"
          docker run --rm "${{ steps.tags.outputs.lite_registry }}:${{ github.event.inputs.version || needs.build.outputs.version }}" \
            python3 -c "import cogflow; print('cogflow', cogflow.__version__)"
