name: Build and Release

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: pip install --upgrade pip build pytest pytest-mock

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/

      - name: Build package
        run: python -m build

      - name: Extract version
        id: version
        run: |
          VERSION=$(python -c "import cogflow; print(cogflow.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *b* || "$VERSION" == *rc* || "$VERSION" == *a* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Built version: $VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cogflow-${{ steps.version.outputs.version }}
          path: dist/

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cogflow/
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: cogflow-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v') && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: cogflow-${{ needs.build.outputs.version }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          generate_release_notes: true

  docker-publish:
    needs: [build, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v') && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine channel and image tags
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          REGISTRY="hiroregistry/cogflow"
          if [[ "$VERSION" == *b* ]]; then
            CHANNEL="beta"
          elif [[ "$VERSION" == *rc* ]]; then
            CHANNEL="rc"
          elif [[ "$VERSION" == *a* ]]; then
            CHANNEL="alpha"
          else
            CHANNEL="stable"
          fi
          if [[ "$CHANNEL" == "stable" ]]; then
            TAGS="$REGISTRY:$VERSION,$REGISTRY:latest"
          else
            TAGS="$REGISTRY:$VERSION,$REGISTRY:latest-$CHANNEL"
          fi
          {
            echo "tags=$TAGS"
            echo "channel=$CHANNEL"
            echo "version_tag=$REGISTRY:$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL"
          echo "Tags: $TAGS"

      - name: Wait for PyPI propagation
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for i in 1 2 3 4 5; do
            if pip index versions cogflow --pre 2>/dev/null | grep -qE "\b$VERSION\b"; then
              echo "cogflow==$VERSION is available on PyPI"
              exit 0
            fi
            echo "Waiting for PyPI propagation ($i/5)..."
            sleep 15
          done
          echo "::error::cogflow==$VERSION not found on PyPI after 75s"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push cogflow:latest image
        uses: docker/build-push-action@v5
        with:
          context: ./docker_image_variants/latest
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            COGFLOW_VERSION=${{ needs.build.outputs.version }}

      - name: Smoke test pushed image
        run: |
          docker pull "${{ steps.tags.outputs.version_tag }}"
          docker run --rm "${{ steps.tags.outputs.version_tag }}" \
            python3 -c "import cogflow, kfp; print('cogflow', cogflow.__version__, 'kfp', kfp.__version__)"
