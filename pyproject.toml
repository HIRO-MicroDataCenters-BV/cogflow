[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogflow"
dynamic = ["version"]  # ✅ version read dynamically from __init__.py
description = "COGFlow — modular machine learning workflow management system"
readme = "README.md"
license = "MIT"

authors = [
  { name = "Sai Kireeti", email = "sai.kireeti@hiro-microdatacenters.nl" }
]

requires-python = ">=3.10"
keywords = ["ml", "workflow", "kfp", "federated-learning", "cogflow", "mlops"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "mlflow (==2.22.0)",
    # kfp 1.8.24 is vendored under top-level `kfp/` (see NOTICE) to remove
    # its hard pin on pydantic<2 from the public dep tree. Transitive runtime
    # deps from kfp are listed below.
    "kfp-pipeline-spec >=0.1.16,<0.2.0",
    "kfp-server-api >=1.1.2,<2.0.0",
    "absl-py >=0.9,<2",
    "click >=7.1.2,<9",
    "cloudpickle >=2.0.0,<3",
    "Deprecated >=1.2.7,<2",
    "docstring-parser >=0.7.3,<1",
    "fire >=0.3.1,<1",
    "google-api-core >=1.31.5,<3.0.0dev,!=2.0.*,!=2.1.*,!=2.2.*,!=2.3.0",
    "google-api-python-client >=1.7.8,<2",
    "google-auth >=1.6.1,<3",
    "google-cloud-storage >=2.2.1,<3",
    "jsonschema >=3.0.1,<5",
    "protobuf >=3.13.0,<4",
    # <2 (was <1): vendored kfp 1.8.24 copied kfp's `<1` cap, which existed
    # only because requests-toolbelt 1.0 dropped the `adapters.appengine`
    # module. cogflow's vendored kfp imports it solely in kfp/_auth.py behind
    # an `isinstance(creds, app_engine.Credentials)` branch — a Google App
    # Engine code path never reached in-cluster. Relaxing to <2 lets the
    # agent SDK's langchain-core 1.x stack (langsmith -> requests-toolbelt>=1)
    # resolve without affecting any live pipeline path.
    "requests-toolbelt >=0.8.0,<2",
    "strip-hints >=0.1.8,<1",
    "tabulate >=0.8.6,<1",
    "typer >=0.3.2,<1.0",
    "uritemplate >=3.0.1,<4",
    "urllib3 <3.0.0",
    "pyyaml (>=6.0.2,<7)",
    "pydantic >=2.0.0,<3.0.0",
    "pydantic-settings >=2.0.0",
    "scikit-learn (==1.7.0)",
    "tenacity",
    # kubernetes>=35 breaks in-cluster auth on the sync client:
    # every in-cluster sync request 401s. kubernetes_asyncio is unaffected.
    "kubernetes<35",
    "kubernetes_asyncio",
    "minio>=7.2.0",
    # mlflow's S3 artifact store imports boto3 lazily inside
    # log_artifact / log_artifacts when the artifact backend is an
    # S3-compatible store — which is the platform default (MinIO).
    # Without boto3 in the dependency tree, every kfp / notebook /
    # service that calls ``cogflow.core.models.log_artifact`` (or
    # any path that uploads run artifacts through MLflow) fails
    # with ``ModuleNotFoundError: No module named 'boto3'``.
    # See ``mlflow/store/artifact/s3_artifact_repo.py:59``.
    "boto3 >=1.34",
    "httpx >=0.25,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "pytest-asyncio>=0.21.0",
  "coverage",
  "build",
  "twine",
  # lint + format (single tool, replaces black/pycodestyle/pylint).
  "ruff>=0.15,<0.16",
  # runtime deps used only by specific test fixtures.
  "kafka-python>=2.0",
  "psutil>=5.9"
]

docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.4.0",
  "pdoc3>=0.11.0"
]

agent = [
  # langchain 1.0 generation. langgraph >=0.4 (resolves to 1.x) pulls
  # langgraph-checkpoint 4.x, whose serializer needs langchain-core's
  # `Reviver(allowed_objects=...)` API — present only in langchain-core 1.x
  # (the ecosystem jumped 0.3 -> 1.0, there is no 0.4/0.5). The agent SDK
  # code is forward-compatible with 1.x as-is (full test suite passes).
  "langgraph >=0.4,<2",
  "langchain-core >=1.0,<2"
]

# Note: a LangSmith adapter was intentionally NOT shipped. LangSmith is a
# commercially-licensed hosted service; users who want it can simply set
# LANGCHAIN_TRACING_V2=true + LANGCHAIN_API_KEY in their own environment.

agent-otel = [
  "cogflow[agent]",
  "openinference-instrumentation-langchain>=0.1.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-exporter-otlp>=1.20.0"
]

# Per-provider chat-model gates. Each one re-exports a single LangChain
# provider's chat client from ``cogflow.agent.chat_models.<provider>`` —
# kept out of ``[agent]`` so the SDK install stays provider-agnostic
# (the Phase-1 design decision) but reachable via the cogflow.agent
# namespace when the user opts in. Add new providers here only when a
# downstream audit produces evidence one is actually used.
openai = [
  "cogflow[agent]",
  "langchain-openai>=1.0,<2"
]

# Heavy LLM-side deps. Lazy-imported inside the call sites that need
# them (e.g. ``cogflow.transformers.ntkmirror_export.controller_to_lora``)
# so ``import cogflow`` stays cheap for pipeline-only users, but those
# call sites do nothing without them. CPU wheels are fine for the
# transformations we ship today — no GPU required.
llm = [
  "torch>=2.0",
  "safetensors>=0.4"
]

# Single-command install for the agent SDK + OTel tracing + provider
# gates + LLM-side transformations (torch + safetensors). Keeps the
# base ``pip install cogflow`` lean (pipeline-only users don't pull
# any of this) while giving "the works" users one command instead of
# remembering the composition.
#
# Whenever a new optional extra lands above, append
# ``cogflow[<extra>]`` here so ``[full]`` keeps meaning "everything
# cogflow can do." The first-run install cost in CI (~200MB of torch
# CPU wheels) is amortised by the wheel cache in ``.github/workflows/ci.yml``.
full = [
  "cogflow[agent-otel]",
  "cogflow[openai]",
  "cogflow[llm]"
]

[project.urls]
Homepage = "https://github.com/HIRO-MicroDataCenters-BV/cogflow"
Issues = "https://github.com/HIRO-MicroDataCenters-BV/cogflow/issues"
Documentation = "https://hiro-microdatacenters-bv.github.io/cogflow"

[tool.setuptools.packages.find]
where = ["."]
include = ["cogflow", "cogflow*", "kfp", "kfp*"]

[tool.setuptools.package-data]
"cogflow" = [
  "core/*",
  "utils/*",
  "api.py",
  "config.py",
  "LICENSE.md"
]
"kfp" = [
  "**/*.yaml",
  "**/*.json",
]

[tool.setuptools]
license-files = ["LICENSE.md", "NOTICE", "kfp/LICENSE"]

# Note: ``pytest.ini`` is the active config file for this repo — pytest prefers
# it over ``[tool.pytest.ini_options]`` here. Agent-test discovery is driven
# from ``pytest.ini`` (testpaths) so a plain ``pytest`` run picks them up
# locally. Wiring the suite into CI (``.github/workflows/ci.yml`` currently
# runs ``pytest tests/`` with only ``[dev]`` installed) is intentionally left
# for a separate, explicitly-reviewed change.
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=cogflow --cov-report=term-missing"
testpaths = ["tests", "cogflow/agent/tests"]

[tool.ruff]
# Project-wide ruff configuration. Replaces the prior black + autopep8 +
# pycodestyle + pylint stack with a single tool. Vendored kfp is excluded
# because it's a frozen fork we don't author; build/dist are output dirs.
extend-exclude = [
  "kfp",
  "build",
  "dist",
  "cogflow.egg-info",
  "mlruns",
  "docker_image_variants",
  "site",
]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/W: pycodestyle. F: pyflakes. I: import sorting (isort). UP: pyupgrade.
# B: bugbear (likely-buggy patterns). E501 (line-too-long) is handled by the
# formatter so we don't double-flag it.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
per-file-ignores = { "cogflow/agent/tests/*" = ["B011"] }

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.dynamic]
version = {attr = "cogflow.__version__"}
