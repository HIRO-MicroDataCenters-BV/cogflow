[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogflow"
dynamic = ["version"]  # ✅ version read dynamically from __init__.py
description = "COGFlow — modular machine learning workflow management system"
readme = "README.md"
license = "MIT"

authors = [
  { name = "Sai Kireeti", email = "sai.kireeti@hiro-microdatacenters.nl" }
]

requires-python = ">=3.10"
keywords = ["ml", "workflow", "kfp", "federated-learning", "cogflow", "mlops"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "mlflow (==2.22.0)",
    # kfp 1.8.24 is vendored under top-level `kfp/` (see NOTICE) to remove
    # its hard pin on pydantic<2 from the public dep tree. Transitive runtime
    # deps from kfp are listed below.
    "kfp-pipeline-spec >=0.1.16,<0.2.0",
    "kfp-server-api >=1.1.2,<2.0.0",
    "absl-py >=0.9,<2",
    "click >=7.1.2,<9",
    "cloudpickle >=2.0.0,<3",
    "Deprecated >=1.2.7,<2",
    "docstring-parser >=0.7.3,<1",
    "fire >=0.3.1,<1",
    "google-api-core >=1.31.5,<3.0.0dev,!=2.0.*,!=2.1.*,!=2.2.*,!=2.3.0",
    "google-api-python-client >=1.7.8,<2",
    "google-auth >=1.6.1,<3",
    "google-cloud-storage >=2.2.1,<3",
    "jsonschema >=3.0.1,<5",
    "protobuf >=3.13.0,<4",
    "requests-toolbelt >=0.8.0,<1",
    "strip-hints >=0.1.8,<1",
    "tabulate >=0.8.6,<1",
    "typer >=0.3.2,<1.0",
    "uritemplate >=3.0.1,<4",
    "urllib3 <3.0.0",
    "pyyaml (>=6.0.2,<7)",
    "pydantic >=2.0.0,<3.0.0",
    "pydantic-settings >=2.0.0",
    "scikit-learn (==1.7.0)",
    "tenacity",
    "kubernetes",
    "kubernetes_asyncio",
    "minio>=7.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "pytest-asyncio>=0.21.0",
  "coverage",
  "build",
  "twine"
]

docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.4.0",
  "pdoc3>=0.11.0"
]

[project.urls]
Homepage = "https://github.com/HIRO-MicroDataCenters-BV/cogflow"
Issues = "https://github.com/HIRO-MicroDataCenters-BV/cogflow/issues"
Documentation = "https://hiro-microdatacenters-bv.github.io/cogflow"

[tool.setuptools.packages.find]
where = ["."]
include = ["cogflow", "cogflow*", "kfp", "kfp*"]

[tool.setuptools.package-data]
"cogflow" = [
  "core/*",
  "utils/*",
  "api.py",
  "config.py",
  "LICENSE.md"
]
"kfp" = [
  "**/*.yaml",
  "**/*.json",
]

[tool.setuptools]
license-files = ["LICENSE.md", "NOTICE", "kfp/LICENSE"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=cogflow --cov-report=term-missing"
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "cogflow.__version__"}
